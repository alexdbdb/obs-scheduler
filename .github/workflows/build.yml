name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/release-audit.py --history
      - run: python tests/check_locales.py
  windows:
    needs: audit
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        shell: pwsh
        run: |
          python -m pip install cmake==3.31.6 ninja==1.13.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import cmake; print(cmake.CMAKE_BIN_DIR)" >> $env:GITHUB_PATH
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Build OBS SDK, plugin and package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Package corresponding sources for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/package-sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: broadcast-scheduler-windows-x64
          if-no-files-found: error
          path: |
            artifacts/broadcast-scheduler-*-windows-x64.zip
            artifacts/Broadcast-Scheduler-*-Setup.exe
            artifacts/SHA256SUMS-*.txt
            artifacts/broadcast-scheduler-*-sources.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-logs
          path: build-windows/Testing/Temporary/
  linux:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.dev -t broadcast-scheduler-dev .
      - name: Compile and test against real OBS 32
        run: docker run --rm -v "$PWD:/work" broadcast-scheduler-dev bash -lc 'cmake -S . -B build -G Ninja -DOBS_SOURCE_DIR=/opt/obs-src -DCMAKE_BUILD_TYPE=Release && cmake --build build -j2 && ctest --test-dir build --output-on-failure'
      - uses: actions/upload-artifact@v4
        with:
          name: broadcast-scheduler-linux
          path: build/broadcast-scheduler.so
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: broadcast-scheduler-windows-x64
          path: release
      - name: Check tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v0.2.1"
      - name: Create draft release for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --title "Broadcast Scheduler ${RELEASE_TAG}" --notes-file CHANGELOG.md
